spring.application.name=notification-service
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# entities must match the Flyway-managed schema; fails fast on drift instead of Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# true only if pointing Flyway at a pre-existing DB with no migration history
spring.flyway.baseline-on-migrate=false

server.port=8080

logging.level.org.hibernate.SQL=debug

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

notification.kafka.outbound-topic=notifications.outbound

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.nodev.notification.model.NotificationEventMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nodev.notification.model
spring.kafka.consumer.auto-offset-reset=earliest
